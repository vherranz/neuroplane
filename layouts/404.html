{{ define "main" }}
<section class="page">
  <div class="wrap" style="text-align:center;padding:90px 0 100px">
    <div class="eyebrow" style="color:var(--crimson)">Error 404</div>
    <h1 style="font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,54px);line-height:1.1;margin:14px 0 16px">Page not found</h1>
    <p style="color:var(--soft);max-width:48ch;margin:0 auto 30px;font-size:16.5px">The page you are looking for doesn't exist or may have been moved. Let's get you back on track.</p>
    <div class="cta-row" style="justify-content:center">
      <a class="btn btn-primary" href="{{ "/" | relLangURL }}">Back home</a>
      <a class="btn btn-ghost" href="{{ "publication/" | relLangURL }}">Browse publications</a>
    </div>
  </div>
</section>
{{ end }}
