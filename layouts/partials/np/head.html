{{/* NeuroPlaNe — hoja de estilos compartida (institutional design). Se carga en TODAS las páginas vía baseof. */}}
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#f6f7f9; --white:#ffffff; --line:#d7dde5; --line-soft:#e6eaf0;
  --ink:#1a2432; --soft:#5f6b7a;
  --blue:#1f4e8c; --blue-deep:#143259; --blue-soft:#e9eff7;
  --crimson:#9c2a3d;
  --serif:'Source Serif 4',Georgia,serif;
  --sans:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --wrap:1160px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Escala tipográfica global: todos los font-size del fichero están en rem (base 16px).
   Para agrandar/reducir todo el texto proporcionalmente, cambia solo este valor.
   Revertir = volver a 16px (o borrar la línea). */
html{font-size:17px;scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 32px}
.eyebrow{font-family:var(--mono);font-size:0.6875rem;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}

/* utility strip + masthead */
.util{background:var(--white);border-bottom:1px solid var(--line-soft)}
.util .wrap{display:flex;justify-content:space-between;align-items:center;min-height:34px;padding:8px 0;
  font-family:var(--mono);font-size:0.6562rem;letter-spacing:.06em;color:var(--soft)}
.util a:hover{color:var(--blue)}
.masthead{background:var(--white);border-bottom:2px solid var(--blue);position:sticky;top:0;z-index:80}
.masthead .wrap{display:flex;align-items:center;justify-content:space-between;height:70px}
.wordmark{display:flex;align-items:center;gap:13px}
.seal{height:38px;width:auto;flex:0 0 auto;display:block}
.wordmark .wm-name{font-family:var(--serif);font-weight:600;font-size:1.1875rem;color:var(--ink);letter-spacing:.005em}
.wordmark .wm-sub{font-family:var(--mono);font-size:0.5938rem;letter-spacing:.16em;color:var(--soft);text-transform:uppercase;margin-top:1px}
.nav{display:flex;gap:30px;font-size:0.9062rem;font-weight:500}
.nav a{color:var(--ink);padding:4px 0;border-bottom:2px solid transparent;transition:.2s}
.nav a:hover,.nav a.active{border-color:var(--blue);color:var(--blue)}
.navtoggle{display:none;background:none;border:1px solid var(--line);border-radius:2px;padding:6px 12px;
  font-family:var(--mono);font-size:0.6875rem;cursor:pointer;color:var(--ink)}

/* buttons */
.btn{font-family:var(--sans);font-weight:600;font-size:0.9062rem;padding:12px 24px;border-radius:2px;
  border:1.5px solid transparent;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-deep)}
.btn-ghost{border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}

/* section scaffolding */
section{padding:78px 0}
.sec-head{margin-bottom:44px;max-width:64ch}
.sec-head h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.625rem,3.2vw,2.1875rem);
  letter-spacing:-.01em;line-height:1.12;margin-top:12px}
.rule{height:2px;width:44px;background:var(--blue);margin-top:10px}

/* hero */
.hero{background:var(--white);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:76px 32px 78px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.125rem,4.6vw,3.25rem);line-height:1.08;
  letter-spacing:-.012em;margin:16px 0 22px}
.hero h1 em{font-style:italic;color:var(--blue)}
.hero .deck{font-size:1.0938rem;color:var(--soft);max-width:50ch;line-height:1.65}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px}

/* atlas plate */
.plate{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:22px 24px 14px;position:relative}
.plate figure{margin:0}
.plate svg,.plate img{width:100%;height:auto;display:block}
.plate .figcap{font-family:var(--mono);font-size:0.6562rem;color:var(--soft);letter-spacing:.04em;
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.lead-line{stroke:var(--blue);stroke-width:1;stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1s ease forwards}
.lead-line.l2{animation-delay:.25s}
.lead-line.l3{animation-delay:.5s}
.plabel{font-family:var(--mono);font-size:0.625rem;fill:var(--ink);letter-spacing:.03em}
.pnum{font-family:var(--mono);font-size:0.625rem;fill:var(--crimson)}
@keyframes draw{to{stroke-dashoffset:0}}

/* research list */
.research-list{border-top:1px solid var(--line)}
.entry{display:grid;grid-template-columns:64px 1fr 1fr;gap:28px;padding:30px 4px;
  border-bottom:1px solid var(--line);align-items:start}
.entry .fig{font-family:var(--mono);font-size:0.75rem;color:var(--crimson);letter-spacing:.05em;padding-top:5px}
.entry h3{font-family:var(--serif);font-weight:600;font-size:1.3125rem;line-height:1.2}
.entry .sub{font-family:var(--mono);font-size:0.6875rem;color:var(--soft);letter-spacing:.03em;margin-top:8px;text-transform:uppercase}
.entry p{font-size:0.9375rem;color:var(--soft);line-height:1.62}
.entry .why{display:inline-block;margin-top:14px;font-size:0.8438rem;color:var(--blue);font-weight:500}

/* species band */
.species{background:var(--blue-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.species .lead{color:var(--soft);font-size:0.9688rem;max-width:60ch;margin-top:14px}
.phylo{display:flex;margin-top:44px;position:relative;flex-wrap:wrap}
.phylo::before{content:"";position:absolute;top:20px;left:5%;right:5%;height:1px;background:var(--blue);opacity:.35}
.node{flex:1 1 12%;min-width:112px;text-align:center;cursor:pointer;background:none;border:0;
  color:inherit;font-family:inherit;padding-bottom:6px;display:block}
.node .bead{width:15px;height:15px;border-radius:50%;background:var(--white);border:2px solid var(--blue);
  margin:13px auto 15px;position:relative;z-index:2;transition:.2s}
.node:hover .bead,.node:focus-visible .bead{background:var(--blue);box-shadow:0 0 0 5px rgba(31,78,140,.14)}
.node .common{font-size:0.875rem;font-weight:600;display:block}
.node .latin{font-family:var(--mono);font-size:0.6562rem;font-style:italic;color:var(--soft);display:block;margin-top:3px}
.node:hover .common,.node:focus-visible .common{color:var(--blue)}

/* news detail (2 columns: text + sticky image aside) */
.post-grid{display:grid;grid-template-columns:1.9fr 1fr;gap:52px;align-items:start}
.post-grid.no-aside{grid-template-columns:minmax(0,74ch)}
.post-body.prose{max-width:none}
.post-aside{position:sticky;top:96px}
.post-aside figure{margin:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--white)}
.post-aside img{width:100%;height:auto;display:block}
.post-aside figcaption{font-size:0.75rem;color:var(--soft);line-height:1.55;padding:14px 16px;border-top:1px solid var(--line);text-align:justify}

/* news list cards (with normalized thumbnail) */
.post-list{border-top:1px solid var(--line)}
.post-card{display:grid;grid-template-columns:230px 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--line);align-items:center}
.pc-thumb{position:relative;display:block;aspect-ratio:8/5;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--blue-soft)}
.pc-thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.85) brightness(1.12) contrast(.96);transition:transform .35s ease,filter .35s ease}
.pc-thumb::after{content:"";position:absolute;inset:0;background:var(--blue);mix-blend-mode:color;opacity:.55;transition:opacity .35s ease;pointer-events:none}
.post-card:hover .pc-thumb img{transform:scale(1.03);filter:none}
.post-card:hover .pc-thumb::after{opacity:0}
.pc-date{font-family:var(--mono);font-size:0.7188rem;color:var(--crimson);letter-spacing:.03em}
.pc-text h3{font-family:var(--serif);font-weight:600;font-size:1.25rem;line-height:1.25;margin:7px 0 0}
.pc-text h3 a:hover{color:var(--blue)}
.pc-text p{font-size:0.9062rem;color:var(--soft);line-height:1.6;margin-top:9px;max-width:70ch}
.pc-more{display:inline-block;margin-top:12px;font-size:0.8438rem;color:var(--blue);font-weight:500}

/* news */
.news-list{border-top:1px solid var(--line)}
.news-item{display:grid;grid-template-columns:120px 1fr;gap:28px;padding:26px 4px;
  border-bottom:1px solid var(--line);align-items:start}
.news-item .ndate{font-family:var(--mono);font-size:0.7188rem;color:var(--crimson);letter-spacing:.03em;padding-top:4px}
.news-item h3{font-family:var(--serif);font-weight:600;font-size:1.1875rem;line-height:1.28}
.news-item h3 a:hover{color:var(--blue)}
.news-item p{font-size:0.9062rem;color:var(--soft);line-height:1.6;margin-top:8px;max-width:74ch}
.news-item .more{display:inline-block;margin-top:12px;font-size:0.8438rem;color:var(--blue);font-weight:500}
.news-foot{margin-top:34px}

/* people */
.group-title{font-family:var(--serif);font-weight:600;font-size:0.9375rem;color:var(--soft);letter-spacing:.02em;
  text-transform:uppercase;margin:40px 0 18px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.group-title:first-of-type{margin-top:8px}
.people-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.person{background:var(--white);border:1px solid var(--line);border-radius:3px;padding:20px;text-align:center;display:block;transition:.2s}
a.person:hover{border-color:#bfc8d4;box-shadow:0 8px 24px -20px rgba(20,27,40,.5)}
a.person:hover .pname{color:var(--blue)}
.collaborators-list{list-style:none;margin:0;padding:0;columns:2;column-gap:40px}
.collaborators-list li{break-inside:avoid;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.collaborators-list li a{font-family:var(--serif);font-weight:600;font-size:0.9688rem;color:var(--ink)}
.collaborators-list li a:hover{color:var(--blue)}
.collaborators-list li span{display:block;font-family:var(--mono);font-size:0.6875rem;color:var(--soft);margin-top:2px}

/* author profile */
.profile-head{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:34px}
.avatar-lg{width:150px;height:150px;border-radius:50%;background:var(--blue-soft);color:var(--blue);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:3.25rem;font-weight:600;border:1px solid var(--line);object-fit:cover;overflow:hidden}
.avatar-lg.pi{background:var(--blue);color:#fff;border-color:var(--blue)}
.profile-meta{flex:1 1 320px}
.profile-meta h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.75rem,3.4vw,2.5rem);line-height:1.1;margin:10px 0 6px}
.prole-lg{font-family:var(--sans);font-size:1rem;color:var(--soft);line-height:1.5}
.orgs{margin-top:12px;font-family:var(--mono);font-size:0.75rem;color:var(--soft)}
.orgs a{color:var(--blue)}.orgs a:hover{text-decoration:underline}
.social{margin-top:16px;display:flex;flex-wrap:wrap;gap:16px;font-family:var(--mono);font-size:0.75rem}
.social a{color:var(--blue);border-bottom:1px solid transparent}
.social a:hover{border-color:var(--blue)}
.avatar{width:74px;height:74px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.625rem;font-weight:600;margin:0 auto 14px;border:1px solid var(--line);object-fit:cover;overflow:hidden}
.avatar.pi{background:var(--blue);color:#fff;border-color:var(--blue)}
.person .pname{font-family:var(--serif);font-weight:600;font-size:0.9688rem;line-height:1.25}
.person .prole{font-family:var(--mono);font-size:0.6562rem;color:var(--soft);margin-top:5px;letter-spacing:.02em}

/* join / contact */
.join{background:var(--blue);color:#eaf1fa;text-align:center}
.join .eyebrow{color:#a9c6ea}
.join h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.6875rem,3.6vw,2.5rem);max-width:22ch;margin:12px auto 16px;color:#fff}
.join h2 em{font-style:italic;color:#fff}
.join p{color:#c9d9ee;max-width:54ch;margin:0 auto 30px;font-size:1rem}
.join .btn-primary{background:#fff;color:var(--blue)}
.join .btn-primary:hover{background:var(--blue-soft)}

/* generic page (single / list content) */
.page{padding:64px 0 78px}
.page-head{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:38px}
.page-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.875rem,4vw,2.75rem);line-height:1.1;letter-spacing:-.012em;margin-top:12px}
.page-head .meta{font-family:var(--mono);font-size:0.7188rem;color:var(--soft);letter-spacing:.03em;margin-top:12px}
.prose{max-width:74ch;font-size:1.0312rem;line-height:1.72;color:var(--ink)}
.prose.wide{max-width:var(--wrap)}
.prose h2{font-family:var(--serif);font-weight:600;font-size:1.625rem;margin:2em 0 .5em;line-height:1.2}
.prose h3{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:1.6em 0 .4em}
.prose p{margin:0 0 1.1em}
.prose a{color:var(--blue);border-bottom:1px solid rgba(31,78,140,.3)}
.prose a:hover{border-color:var(--blue)}
.prose ul,.prose ol{margin:0 0 1.1em 1.2em}
.prose li{margin:.3em 0}
.prose img{max-width:100%;height:auto;border-radius:3px}
.prose blockquote{border-left:3px solid var(--blue);padding-left:18px;color:var(--soft);font-style:italic;margin:1.2em 0}
.prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.prose code{font-family:var(--mono);font-size:.9em;background:var(--blue-soft);padding:2px 6px;border-radius:2px}

/* news search (centered, narrow) */
.news-controls{max-width:560px;margin:0 auto}
.news-controls .searchbar{background:var(--white)}

/* explorer (publications page) */
.ex-controls{background:var(--white);border:1px solid var(--line);border-radius:3px;padding:24px 24px 10px}
.searchbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:2px;padding:11px 14px;background:var(--paper)}
.searchbar input{border:0;background:none;outline:none;font-family:var(--sans);font-size:0.9688rem;width:100%;color:var(--ink)}
.searchbar svg{flex:0 0 auto;color:var(--soft)}
.filter-group{margin-top:20px}
.filter-group .flabel{font-family:var(--mono);font-size:0.6562rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:11px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:0.75rem;padding:6px 13px;border:1px solid var(--line);border-radius:2px;
  background:var(--white);color:var(--soft);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ex-meta{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 16px;
  font-family:var(--mono);font-size:0.75rem;color:var(--soft)}
.ex-meta button{font-family:var(--mono);font-size:0.75rem;background:none;border:0;color:var(--blue);cursor:pointer;border-bottom:1px solid transparent}
.ex-meta button:hover{border-color:var(--blue)}
.paper{background:var(--white);border:1px solid var(--line);border-radius:3px;padding:20px 22px;margin-bottom:11px;transition:.2s}
.paper:hover{border-color:#bfc8d4;box-shadow:0 8px 24px -20px rgba(20,27,40,.5)}
.p-top{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.p-title{font-family:var(--serif);font-weight:600;font-size:1.125rem;line-height:1.26}
.p-title a:hover{color:var(--blue)}
.p-year{font-family:var(--mono);font-size:0.8125rem;color:var(--soft);flex:0 0 auto}
.p-journal{font-family:var(--mono);font-size:0.7188rem;color:var(--blue);margin-top:6px;font-style:italic}
.p-authors{font-size:0.8438rem;color:var(--soft);margin-top:8px;line-height:1.5}
.p-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.p-links{margin-top:12px;display:flex;gap:14px;font-family:var(--mono);font-size:0.7188rem}
.p-links a{color:var(--blue);border-bottom:1px solid transparent}
.p-links a:hover{border-color:var(--blue)}
.ptag{font-family:var(--mono);font-size:0.6562rem;letter-spacing:.02em;padding:3px 9px;border-radius:2px;background:var(--paper);color:var(--soft);border:1px solid var(--line-soft)}
.ptag.sp{color:var(--blue);background:var(--blue-soft);border-color:transparent}
.empty{text-align:center;padding:50px;color:var(--soft);font-family:var(--mono);font-size:0.8125rem}

/* research page */
.research-intro{max-width:78ch;font-size:1.0625rem;line-height:1.7;color:var(--soft);margin:14px 0 8px}
.research-intro p{margin:0 0 1em}
.research-lines{margin-top:20px}
.rline{display:grid;grid-template-columns:0.85fr 1.55fr;gap:52px;padding:44px 0;border-top:1px solid var(--line);align-items:start}
.rline-side{position:sticky;top:96px}
.rnum{font-family:var(--serif);font-weight:600;font-size:2.5rem;color:var(--blue);line-height:1;opacity:.9}
.rtitle{font-family:var(--serif);font-weight:600;font-size:1.4375rem;line-height:1.2;margin:14px 0 0;color:var(--ink)}
.rsubtitle{font-size:0.9062rem;font-style:italic;color:var(--soft);margin-top:8px;line-height:1.5}
.rkeywords{font-family:var(--mono);font-size:0.6875rem;letter-spacing:.03em;text-transform:uppercase;color:var(--blue);margin-top:14px}
.rline-body{font-size:1rem;line-height:1.7;color:var(--ink)}
.rline-body p{margin:0 0 1.05em}
.rline-body p:last-child{margin-bottom:0}

/* funding */
.funding-block{margin-top:56px;padding-top:34px;border-top:2px solid var(--blue);max-width:80ch}
.funding-block h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0 0 12px}
.funding-block p{color:var(--soft);margin:0 0 12px;line-height:1.6}
.funding-block a{color:var(--blue)}
.funding-block a:hover{text-decoration:underline}
.funding-logos{display:flex;gap:56px;align-items:center;flex-wrap:wrap;margin-top:28px}
.funding-logo{width:auto;display:block}
/* alturas distintas para igualar el ancho visual (~225px): GVA 1.88:1, UV 2.38:1 */
.funding-logo-gva{height:120px}
.funding-logo-uv{height:95px}
.funding-logos a:hover{opacity:.8}
@media(max-width:880px){
  .rline{grid-template-columns:1fr;gap:16px;padding:32px 0}
  .rline-side{position:static}
  .funding-logos{gap:32px}
  .funding-logo-gva{height:88px}
  .funding-logo-uv{height:70px}
}

/* contact */
.contact-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:44px;align-items:start}
.contact-info h3{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:0 0 14px}
.contact-map{border:1px solid var(--line);border-radius:3px;overflow:hidden}
.contact-map iframe{display:block;width:100%;height:460px}
@media(max-width:880px){.contact-grid{grid-template-columns:1fr;gap:28px}}

/* footer */
footer.site{background:var(--white);border-top:1px solid var(--line);padding:44px 0}
footer.site .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
footer.site .fname{font-family:var(--serif);font-weight:600;font-size:1rem}
footer.site .fmeta{font-family:var(--mono);font-size:0.7188rem;color:var(--soft);margin-top:5px;letter-spacing:.03em}
footer.site .flinks{font-family:var(--mono);font-size:0.75rem;color:var(--soft)}
footer.site .flinks a:hover{color:var(--blue)}
.funders{font-family:var(--mono);font-size:0.6562rem;color:var(--soft);letter-spacing:.05em;text-align:right}

@media(max-width:880px){
  .hero .wrap{grid-template-columns:1fr;gap:40px;padding:56px 32px}
  .entry{grid-template-columns:44px 1fr;gap:18px}
  .entry > div:nth-child(3){grid-column:2}
  .news-item{grid-template-columns:1fr;gap:6px}
  .post-grid{grid-template-columns:1fr;gap:24px}
  .post-aside{position:static;order:-1}
  .post-card{grid-template-columns:1fr;gap:12px}
